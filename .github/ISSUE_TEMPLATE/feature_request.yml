name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Good requests start with the problem, not the solution. For an open question, [Discussions](https://github.com/autobot-lab/fastpilot/discussions) is a better place.
  - type: textarea
    id: problem
    attributes:
      label: What problem do you have?
      description: What were you trying to do, and what got in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like fastpilot to do?
      description: A few words or a sketch is enough. fastpilot aims for few clicks and few settings.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead? (optional)
  - type: dropdown
    id: help
    attributes:
      label: Would you like to build it?
      options:
        - "No, I'm just suggesting it"
        - "Yes, I'd like to send a pull request"
        - "Maybe, with some guidance"
