# Tag vX.Y.Z (or run by hand on a branch as a dry run): build the release archives for macOS
# (arm64 + x86_64) and Linux x86_64 with the Android agent embedded, then attach them and their
# .sha256 to the GitHub release vX.Y.Z. A dry run keeps them as workflow artifacts only.
name: release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions agree
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          grep -q "\"version\": \"$version\"" packaging/npm/package.json || { echo "packaging/npm/package.json is not at $version"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then echo "tag ${GITHUB_REF_NAME} but Cargo.toml says $version"; exit 1; fi
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (platform 35, build tools) for the agent APK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - run: agent-android/build.sh
      # A published binary always carries the Android helper: packaging stops without it.
      - run: scripts/package.sh --target ${{ matrix.target }} --require-android
      - name: Smoke run
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          f=$(ls dist/*.tar.gz); d=$(basename "$f" .tar.gz)
          tar -xzf "$f" -C dist && "dist/$d/fastpilot" --version
      - name: The binary carries the Android helper
        shell: bash
        run: |
          # The embedded helper APK is a zip: its file list (classes.dex) is in the binary.
          f=$(ls dist/*.tar.gz); d=$(basename "$f" .tar.gz); rm -rf "dist/$d"
          tar -xzf "$f" -C dist && LC_ALL=C grep -aq "classes.dex" "dist/$d/fastpilot" || { echo "::error::the release binary has no Android helper (agent APK)"; exit 1; }
          rm -rf "dist/$d"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fastpilot-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
  release:
    # Only a pushed tag releases; a manual run (even on a tag) is a dry run (Security, Low 5).
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - run: scripts/publish.sh
        env:
          GH_TOKEN: ${{ github.token }}
  # npm Trusted Publishing (A2 TP1): publish packaging/npm with a short-lived OIDC identity of this
  # workflow, no token stored anywhere, with provenance. Runs only for a tag, after the GitHub
  # Release exists (the package downloads its binary from it). Needs a one-time setting on
  # npmjs.com (fastpilot › Settings › Trusted Publisher › GitHub Actions: autobot-lab / fastpilot /
  # release.yml, environment npm); without it npm refuses, this job fails, and the release is
  # published by hand with the passkey as before (docs/releasing.md).
  # The environment `npm` needs the owner's approval in GitHub before this job starts: that click
  # replaces the passkey, so push access alone cannot publish (Security, Medium 1).
  publish-npm:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15
    concurrency:
      group: publish-npm
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: The tag is the package version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./packaging/npm/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} is not v${version} (packaging/npm/package.json); nothing was published"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: npm 11.5.1 or newer (needed for Trusted Publishing)
        run: npm install -g npm@11.12.1 && npm --version
      - name: Publish to npm (OIDC, provenance)
        working-directory: packaging/npm
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "fastpilot@${VERSION}" version >/dev/null 2>&1; then
            echo "fastpilot ${VERSION} is already on npm (published by hand); nothing to do."
            exit 0
          fi
          if ! npm publish --access public --provenance; then
            echo "::error::npm refused the publish. Set up Trusted Publishing once on npmjs.com: fastpilot › Settings › Trusted Publisher › GitHub Actions, organization autobot-lab, repository fastpilot, workflow release.yml, environment npm. Until then publish by hand: cd packaging/npm && npm publish (docs/releasing.md)."
            exit 1
          fi
  # Official MCP Registry (B2 G1): list fastpilot as io.github.autobot-lab/fastpilot, after npm
  # has the version (the registry checks the npm package's mcpName). GitHub OIDC proves the
  # io.github.autobot-lab namespace; no token. Runs after publish-npm (the owner's approval in the
  # `npm` environment). `needs` is not a security boundary against a changed workflow: what keeps
  # this listing safe is that only admins may create `v*` tags (docs/releasing.md, owner steps).
  # mcp-publisher 1.8.11: its Sigstore bundle was verified by hand (cosign, PR #125).
  publish-mcp:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag is the server version
        shell: bash
        run: |
          v_server="$(jq -r .version server.json)"
          v_pkg="$(jq -r '.packages[0].version' server.json)"
          v_npm="$(jq -r .version packaging/npm/package.json)"
          if [ "${GITHUB_REF_NAME}" != "v${v_server}" ] || [ "${v_pkg}" != "${v_server}" ] || [ "${v_npm}" != "${v_server}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME}, server.json ${v_server} (package ${v_pkg}) and npm ${v_npm} do not agree; nothing was published"
            exit 1
          fi
      - name: Wait until npm shows this version (up to 10 minutes)
        shell: bash
        run: |
          # The registry reads mcpName from npm; npm can take minutes to show a new version.
          VERSION="$(jq -r .version server.json)"
          NAME="$(jq -r .name server.json)"
          for try in $(seq 1 30); do
            got="$(curl -fsS "https://registry.npmjs.org/fastpilot/${VERSION}" 2>/dev/null | jq -r '.mcpName // empty' 2>/dev/null || true)"
            if [ "$got" = "$NAME" ]; then
              echo "npm shows fastpilot ${VERSION} with mcpName ${NAME} (check ${try} of 30)."
              exit 0
            fi
            echo "npm does not show fastpilot ${VERSION} with mcpName ${NAME} yet (check ${try} of 30); waiting 20 s."
            sleep 20
          done
          echo "::error::npm still does not show fastpilot ${VERSION} with mcpName ${NAME} after 10 minutes, so the MCP Registry was not asked. npm and the GitHub Release are not affected. When 'npm view fastpilot@${VERSION} mcpName' prints ${NAME}, re-run this job (Re-run failed jobs)."
          exit 1
      - name: mcp-publisher 1.8.11 (pinned by its SHA-256)
        shell: bash
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.11/mcp-publisher_linux_amd64.tar.gz
          echo "99fbd857ae2277e5e4a4a2cddc7f4d3e64612c6f90950f44584c3539c9df854f  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Publish to the MCP Registry (GitHub OIDC)
        shell: bash
        run: |
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc || { echo "::error::the MCP Registry refused the GitHub OIDC login for namespace io.github.autobot-lab. The exact message is above; npm and the GitHub Release are not affected."; exit 1; }
          # npm already shows the version (step above); a short retry for the registry's own lookup.
          for try in 1 2 3; do
            if ./mcp-publisher publish server.json; then exit 0; fi
            [ "$try" -lt 3 ] && sleep 20
          done
          echo "::error::the MCP Registry refused fastpilot. The exact message is above; npm and the GitHub Release are not affected. A version is listed once: the repair is the next patch version."
          exit 1
