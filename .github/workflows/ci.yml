# Every push to main and every pull request: the workspace compiles.
# Tests run locally (`cargo test --workspace --lib`, the web e2e suites, Android/iOS on a Mac).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A `.fastpilot` folder is what fastpilot writes where it runs (chats, runs, logins). One in git
      # makes every test run in that folder see a project (FastTest 8128: bin/fastpilot/.fastpilot).
      - name: No .fastpilot folder is in git
        run: |
          if git ls-files | grep -E '(^|/)\.fastpilot(/|$)'; then
            echo "::error::A generated .fastpilot folder is in git. Remove it: git rm -r --cached <folder>"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --workspace --all-targets --locked
