# CI for fastpilot. Tests are not run in the pipeline; run them locally (`cargo test
# --workspace --lib`, the web e2e suites, and the Android/iOS suites on a Mac).
#
#   build          every MR and main: the workspace compiles
#   package-linux  tags vX.Y.Z (manual on MRs, or a pipeline with FASTPILOT_PACKAGE=1): Linux x86_64 release archive with the
#                  Android agent embedded (Android SDK installed in the job)
#   release        tags vX.Y.Z: upload the Linux archive to the package registry and create the
#                  GitLab release. The macOS archives are built and uploaded on a Mac first:
#                  scripts/package.sh && scripts/package.sh --target x86_64-apple-darwin &&
#                  GITLAB_TOKEN=... scripts/publish.sh   (see docs/releasing.md)

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    # A packaging dry run on any branch: run a pipeline with FASTPILOT_PACKAGE=1.
    - if: $FASTPILOT_PACKAGE == "1"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Branch pushes with an open MR run as MR pipelines only.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [build, release]

default:
  image: rust:1-bookworm
  interruptible: true

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  CARGO_TERM_COLOR: always

.cache: &cache
  key:
    files: [Cargo.lock]
  paths: [.cargo-home/registry, target/]

build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  cache: *cache
  script:
    - cargo build --workspace --all-targets

package-linux:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $FASTPILOT_PACKAGE == "1"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  cache: *cache
  variables:
    ANDROID_HOME: /opt/android
  script:
    # The version in Cargo.toml, the npm package and the tag must agree.
    - version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
    - 'grep -q "\"version\": \"$version\"" packaging/npm/package.json || { echo "packaging/npm/package.json is not at $version"; exit 1; }'
    - if [ -n "${CI_COMMIT_TAG:-}" ] && [ "$CI_COMMIT_TAG" != "v$version" ]; then echo "tag $CI_COMMIT_TAG but Cargo.toml says $version"; exit 1; fi
    # Android SDK (platform 35 + build tools) to build the agent APK that the binary embeds.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openjdk-17-jdk-headless unzip zip >/dev/null
    - curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o /tmp/clt.zip
    - mkdir -p "$ANDROID_HOME/cmdline-tools" && unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools" && mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
    - yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
    - '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null'
    - agent-android/build.sh
    - scripts/package.sh
    - tar -xzOf dist/fastpilot-$version-x86_64-unknown-linux-gnu.tar.gz fastpilot-$version-x86_64-unknown-linux-gnu/fastpilot > /tmp/fastpilot && chmod +x /tmp/fastpilot && /tmp/fastpilot --version
    - echo "VERSION=$version" > release.env
  artifacts:
    paths: [dist/]
    expire_in: 30 days
    reports:
      dotenv: release.env

release:
  stage: release
  needs: [package-linux]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - apk add --no-cache curl >/dev/null
    - sh scripts/publish.sh
  release:
    tag_name: $CI_COMMIT_TAG
    name: fastpilot $CI_COMMIT_TAG
    description: |
      Install: `curl -fsSL https://gitlab.com/autobot-lab/fastpilot/-/raw/main/scripts/install.sh | sh`
      (macOS arm64/x86_64, Linux x86_64), `npm install -g fastpilot`, or Homebrew (see README).
      Every archive has a `.sha256` next to it.
    assets:
      links:
        - name: macOS arm64
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/fastpilot/$VERSION/fastpilot-$VERSION-aarch64-apple-darwin.tar.gz
          link_type: package
        - name: macOS x86_64
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/fastpilot/$VERSION/fastpilot-$VERSION-x86_64-apple-darwin.tar.gz
          link_type: package
        - name: Linux x86_64
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/fastpilot/$VERSION/fastpilot-$VERSION-x86_64-unknown-linux-gnu.tar.gz
          link_type: package
