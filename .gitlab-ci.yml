# CI for fastpilot (issue #8): red tests must not reach main.
#
#   unit        every MR and main: cargo test --workspace --lib + clippy
#   web-e2e     every MR and main: real Chromium, headless (the web end-to-end tests)
#   mobile      manual, or nightly when FASTPILOT_MACOS_RUNNER=1: Android emulator + iOS
#               simulator tests on a self-hosted macOS runner tagged `macos`
#   stability   nightly (pipeline schedule): `fastpilot stability` on the reference web flow,
#               plus a `fastpilot run` JUnit/HTML report when ANTHROPIC_API_KEY is set
#
# Chrome refuses to run as root without --no-sandbox, so the browser jobs run as an
# unprivileged user.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Branch pushes with an open MR run as MR pipelines only.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [test, nightly]

default:
  image: rust:1-bookworm
  interruptible: true

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

.cargo-cache: &cargo-cache
  key:
    files: [Cargo.lock]
  paths: [.cargo-home/registry, .cargo-home/git, target/]

.linux-rules: &linux-rules
  - if: $CI_PIPELINE_SOURCE == "schedule"
    when: never
  - when: on_success

.chromium: &chromium
  - apt-get update -qq
  - apt-get install -y -qq --no-install-recommends chromium fonts-noto-core fonts-noto-color-emoji >/dev/null
  # /dev/shm is small in containers; fastpilot launches Chrome through this wrapper.
  - printf '#!/bin/sh\nexec /usr/bin/chromium --disable-dev-shm-usage "$@"\n' > /usr/local/bin/chromium-ci
  - chmod +x /usr/local/bin/chromium-ci
  - useradd -m ci
  - chown -R ci "$CI_PROJECT_DIR"

unit:
  stage: test
  rules: *linux-rules
  cache: *cargo-cache
  script:
    - rustup component add clippy
    - cargo test --workspace --lib --no-fail-fast
    - cargo clippy --workspace --all-targets -- -D warnings

web-e2e:
  stage: test
  rules: *linux-rules
  cache: *cargo-cache
  variables:
    FASTPILOT_CHROME: /usr/local/bin/chromium-ci
  before_script: *chromium
  script:
    - >
      runuser -u ci -- env PATH="$PATH" HOME=/home/ci CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$RUSTUP_HOME"
      FASTPILOT_CHROME="$FASTPILOT_CHROME"
      cargo test --no-fail-fast
      --test mcp_login --test web_advanced --test maestro_steps --test run_cli --test test_data --test cli
      $(for t in snapshot_web secrets_web viewport_web screenshot_web; do [ -f bin/fastpilot/tests/$t.rs ] && echo --test $t; done)

mobile:
  stage: test
  tags: [macos]
  rules:
    - if: $FASTPILOT_MACOS_RUNNER == "1" && $CI_PIPELINE_SOURCE == "schedule"
    - if: $FASTPILOT_MACOS_RUNNER == "1"
      when: manual
      allow_failure: true
  variables:
    CARGO_HOME: $HOME/.cargo
  script:
    # Needs Xcode, a booted iOS simulator or Android emulator, and the Android SDK (ANDROID_HOME).
    - agent-android/build.sh
    - ios-runner/build.sh
    - cargo test --release --no-fail-fast --test android --test ios

stability:
  stage: nightly
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  cache: *cargo-cache
  variables:
    FASTPILOT_CHROME: /usr/local/bin/chromium-ci
    FASTPILOT_VARS: DEMO_PASS
    DEMO_PASS: rahasia123
    FASTPILOT_DIR: $CI_PROJECT_DIR/stability-out
  before_script: *chromium
  script:
    - cargo build --release -p fastpilot
    - chown -R ci "$CI_PROJECT_DIR"
    - >
      runuser -u ci -- env PATH="$PATH" HOME=/home/ci FASTPILOT_CHROME="$FASTPILOT_CHROME"
      FASTPILOT_VARS="$FASTPILOT_VARS" DEMO_PASS="$DEMO_PASS" FASTPILOT_DIR="$FASTPILOT_DIR"
      bash -o pipefail -c './target/release/fastpilot stability examples/flows/login-web.yaml --runs 30 | tee stability.txt'
    - >
      if [ -n "$ANTHROPIC_API_KEY" ]; then
      runuser -u ci -- env PATH="$PATH" HOME=/home/ci FASTPILOT_CHROME="$FASTPILOT_CHROME"
      FASTPILOT_VARS="$FASTPILOT_VARS" DEMO_PASS="$DEMO_PASS" FASTPILOT_DIR="$FASTPILOT_DIR" ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"
      ./target/release/fastpilot run tests/login.md --junit junit.xml --html report.html;
      fi
  artifacts:
    when: always
    expire_in: 30 days
    paths: [stability.txt, junit.xml, report.html, stability-out/runs/]
    reports:
      junit: junit.xml
