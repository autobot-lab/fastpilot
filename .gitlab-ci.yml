# CI for fastpilot: build only. Tests are not run in the pipeline; run them locally
# (`cargo test --workspace --lib`, the web e2e suites, and the Android/iOS suites on a Mac).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Branch pushes with an open MR run as MR pipelines only.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  image: rust:1-bookworm
  interruptible: true

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  CARGO_TERM_COLOR: always

build:
  stage: build
  cache:
    key:
      files: [Cargo.lock]
    paths: [.cargo-home/registry, target/]
  script:
    - cargo build --workspace --all-targets
