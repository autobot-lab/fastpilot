[workspace]
resolver = "2"
members = ["crates/*", "bin/fastpilot"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
fastpilot-core = { path = "crates/core" }
fastpilot-web = { path = "crates/web" }
fastpilot-mcp = { path = "crates/mcp" }
fastpilot-memory = { path = "crates/memory" }
fastpilot-android = { path = "crates/android" }
fastpilot-ios = { path = "crates/ios" }
aes-gcm = "0.10"
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.8", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
