<body class="unlock">
<main class="unlock-box" id="unlock">
  <p class="unlock-busy" id="busy" role="status">Opening the dashboard…</p>
  <section id="out" hidden aria-labelledby="out-t">
    <h1 id="out-t">This browser is not signed in</h1>
    <p>It was not remembered, it was forgotten, or its 30 days ended. Open the link that <code>fastpilot ui</code> printed in the Terminal: it works once, for 10 minutes.</p>
    <p class="s muted">No link? Open the Terminal and type <code>fastpilot ui</code>. It prints a fresh one.</p>
  </section>
</main>
